# Drop-in for /usr/lib/systemd/user/dms.service.
# DMS_HIDE_TRAYIDS is a comma-separated list of StatusNotifierItem Ids that
# DMS leaves out of the bar's tray entirely (case-insensitive). Find an Id with:
#   busctl --user get-property <bus-name> <path> org.kde.StatusNotifierItem Id
# Slack has no setting to drop its tray icon on Linux.
[Service]
Environment=DMS_HIDE_TRAYIDS=Slack_status_icon_1
