# Framework laptop built-in keyboard ("AT Translated Set 2 keyboard").
# Its bottom row is PC-style (Ctrl, Fn, Super, Alt, Space). Swap Super and
# left Alt so the key next to the space bar is Super, like Cmd on a Mac and
# like the Logitech ERGO K860 in Mac mode (Fn+O). That way the same thumb
# position is Mod in niri on every keyboard.
[ids]
0001:0001

[main]
include common

# Use layer(), not [aliases]. An alias to a modifier keycode (leftalt =
# leftmeta) makes keyd *tap* Super the moment the key goes down instead of
# holding it, so Alt+Space etc. never register as Super+Space.
leftalt = layer(meta)
leftmeta = layer(alt)
