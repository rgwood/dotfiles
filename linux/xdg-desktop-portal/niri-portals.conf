# Overrides /usr/share/xdg-desktop-portal/niri-portals.conf.
# xdg-desktop-portal-gnome's GlobalShortcuts needs GNOME Shell to persist
# bindings, so under niri it re-prompts "Add Keyboard Shortcuts" on every app
# launch (Claude Desktop, 1Password) and the shortcuts never work anyway.
# Bind keys in niri's config.kdl instead.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.GlobalShortcuts=none;
